[theme]
base = "dark"
primaryColor = "#2563EB"
backgroundColor = "#06080D"
secondaryBackgroundColor = "#0B0F19"
textColor = "#F8FAFC"
font = "sans serif"

[server]
maxMessageSize = 1000   # MB – full-res 4K batches + ZIP can be large
disconnectedSessionTTL = 1800 # 30 menit toleransi saat laptop terkunci/sleep
